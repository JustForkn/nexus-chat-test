<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messenger · Nexus Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       BASE
       ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #18191a;
      color: #e4e6eb;
      overflow: hidden;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
    }

    input {
      font-family: inherit;
      outline: none;
    }

    /* ============================================================
       APP SHELL
       ============================================================ */
    .messenger {
      display: flex;
      height: 100vh;
      width: 100vw;
      background: #18191a;
    }

    /* ============================================================
       SIDEBAR (left column)
       ============================================================ */
    .sidebar {
      width: 340px;
      flex-shrink: 0;
      background: #242526;
      border-right: 1px solid #3a3b3c;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 16px 16px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar-header .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.6px;
      background: linear-gradient(135deg, #0084ff, #0064e0);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      flex: 1;
    }

    .sidebar-header .my-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #3a3b3c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 600;
      color: #b0b3b8;
      overflow: hidden;
      flex-shrink: 0;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .sidebar-header .my-avatar:hover {
      opacity: 0.85;
    }

    .sidebar-header .my-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .search-wrap {
      padding: 0 16px 12px;
    }

    .search-input {
      width: 100%;
      background: #3a3b3c;
      border: 1px solid transparent;
      border-radius: 20px;
      padding: 9px 16px;
      font-size: 14px;
      color: #e4e6eb;
      transition: border-color 0.15s, background 0.15s;
    }

    .search-input::placeholder {
      color: #8a8d91;
    }

    .search-input:focus {
      border-color: #0084ff;
      background: #2a2b2c;
    }

    .sidebar-section-label {
      padding: 6px 20px 6px;
      font-size: 12px;
      font-weight: 600;
      color: #8a8d91;
      letter-spacing: 0.3px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-section-label .count-pill {
      background: #3a3b3c;
      color: #b0b3b8;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .contact-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px 12px;
    }

    .contact-list::-webkit-scrollbar {
      width: 6px;
    }
    .contact-list::-webkit-scrollbar-thumb {
      background: #3a3b3c;
      border-radius: 3px;
    }
    .contact-list::-webkit-scrollbar-thumb:hover {
      background: #4a4b4c;
    }

    .contact {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.1s;
    }

    .contact:hover {
      background: #3a3b3c;
    }

    .contact-avatar-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .contact-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #0084ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      overflow: hidden;
    }

    .contact-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .online-dot {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #31a24c;
      border: 2px solid #242526;
    }

    .contact-info {
      flex: 1;
      min-width: 0;
    }

    .contact-name {
      font-size: 14px;
      font-weight: 600;
      color: #e4e6eb;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .contact-preview {
      font-size: 12px;
      color: #b0b3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    /* ============================================================
       MAIN CHAT AREA (right column)
       ============================================================ */
    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #18191a;
      min-width: 0;
    }

    .chat-topbar {
      background: #242526;
      border-bottom: 1px solid #3a3b3c;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .chat-topbar-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #0084ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      overflow: hidden;
      flex-shrink: 0;
    }

    .chat-topbar-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .chat-topbar-info {
      flex: 1;
      min-width: 0;
    }

    .chat-topbar-title {
      font-size: 15px;
      font-weight: 700;
      color: #e4e6eb;
    }

    .chat-topbar-status {
      font-size: 12px;
      color: #31a24c;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 1px;
    }

    .chat-topbar-status .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #31a24c;
    }

    /* ============================================================
       SETUP PANEL (identity form)
       ============================================================ */
    .setup-panel {
      background: #242526;
      border-bottom: 1px solid #3a3b3c;
      padding: 14px 16px;
      flex-shrink: 0;
    }

    .setup-panel.hidden {
      display: none;
    }

    .setup-panel h3 {
      font-size: 13px;
      font-weight: 600;
      color: #0084ff;
      margin-bottom: 10px;
      letter-spacing: 0.2px;
    }

    .setup-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .setup-input {
      flex: 1;
      min-width: 180px;
      background: #3a3b3c;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      color: #e4e6eb;
      transition: border-color 0.15s;
    }

    .setup-input::placeholder {
      color: #8a8d91;
    }

    .setup-input:focus {
      border-color: #0084ff;
    }

    .setup-input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .setup-btn {
      background: #0084ff;
      color: #fff;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.15s, opacity 0.15s;
      white-space: nowrap;
    }

    .setup-btn:hover:not(:disabled) {
      background: #0072db;
    }

    .setup-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .setup-btn.secondary {
      background: #3a3b3c;
      color: #e4e6eb;
    }
    .setup-btn.secondary:hover:not(:disabled) {
      background: #4a4b4c;
    }

    .setup-avatar-preview {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #3a3b3c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 600;
      color: #b0b3b8;
      overflow: hidden;
      flex-shrink: 0;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.15s;
    }

    .setup-avatar-preview:hover {
      border-color: #0084ff;
    }

    .setup-avatar-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .setup-error {
      font-size: 12px;
      color: #f0284a;
      margin-top: 8px;
      min-height: 15px;
    }

    #pfpFileInput {
      display: none;
    }

    /* ============================================================
       MESSAGES AREA
       ============================================================ */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .messages::-webkit-scrollbar {
      width: 8px;
    }
    .messages::-webkit-scrollbar-thumb {
      background: #3a3b3c;
      border-radius: 4px;
    }

    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      margin-bottom: 8px;
      animation: msgIn 0.2s ease;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-row.own {
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #0084ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      overflow: hidden;
      flex-shrink: 0;
    }

    .msg-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .msg-bubble-wrap {
      max-width: 60%;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .msg-sender-name {
      font-size: 12px;
      color: #b0b3b8;
      padding: 0 12px;
      margin-bottom: 2px;
    }

    .msg-row.own .msg-sender-name {
      text-align: right;
    }

    .msg-bubble {
      background: #3a3b3c;
      color: #e4e6eb;
      border-radius: 18px;
      padding: 8px 14px;
      font-size: 15px;
      line-height: 1.35;
      word-wrap: break-word;
      word-break: break-word;
    }

    .msg-row.own .msg-bubble {
      background: #0084ff;
      color: #fff;
    }

    .msg-time {
      font-size: 11px;
      color: #8a8d91;
      padding: 0 12px;
      margin-top: 2px;
    }

    .msg-row.own .msg-time {
      text-align: right;
    }

    .system-msg {
      text-align: center;
      font-size: 12px;
      color: #8a8d91;
      padding: 12px 0;
      font-style: italic;
    }

    /* ============================================================
       COMPOSER
       ============================================================ */
    .composer {
      background: #242526;
      border-top: 1px solid #3a3b3c;
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }

    .composer-input {
      flex: 1;
      background: #3a3b3c;
      border: 1px solid transparent;
      border-radius: 20px;
      padding: 10px 18px;
      font-size: 15px;
      color: #e4e6eb;
      transition: border-color 0.15s;
    }

    .composer-input::placeholder {
      color: #8a8d91;
    }

    .composer-input:focus {
      border-color: #0084ff;
    }

    .composer-input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .send-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #0084ff;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
      flex-shrink: 0;
      font-size: 16px;
    }

    .send-btn:hover:not(:disabled) {
      background: #0072db;
    }
    .send-btn:active:not(:disabled) {
      transform: scale(0.94);
    }
    .send-btn:disabled {
      background: #3a3b3c;
      color: #8a8d91;
      cursor: not-allowed;
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 800px) {
      .sidebar {
        width: 100%;
        display: none;
      }
      .sidebar.mobile-show {
        display: flex;
      }
      .chat-main {
        width: 100%;
      }
      .msg-bubble-wrap {
        max-width: 80%;
      }
    }
  </style>
</head>
<body>
  <div class="messenger">
    <!-- ============================================================
         SIDEBAR
         ============================================================ -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">Messenger</div>
        <div class="my-avatar" id="mySidebarAvatar" title="your profile picture">?</div>
      </div>

      <div class="search-wrap">
        <input type="text" class="search-input" id="searchInput" placeholder="Search Messenger">
      </div>

      <div class="sidebar-section-label">
        <span>Online now</span>
        <span class="count-pill" id="onlineCount">0</span>
      </div>

      <div class="contact-list" id="contactList">
        <!-- contacts injected here -->
      </div>
    </aside>

    <!-- ============================================================
         MAIN CHAT AREA
         ============================================================ -->
    <main class="chat-main">
      <!-- top bar -->
      <div class="chat-topbar">
        <div class="chat-topbar-avatar" id="topAvatar">#</div>
        <div class="chat-topbar-info">
          <div class="chat-topbar-title" id="topTitle">Nexus Global Chat</div>
          <div class="chat-topbar-status" id="topStatus">
            <span class="status-dot"></span>
            <span id="topStatusText">connecting...</span>
          </div>
        </div>
      </div>

      <!-- identity setup -->
      <div class="setup-panel" id="setupPanel">
        <h3>Set your identity to join the chat</h3>
        <div class="setup-row">
          <div class="setup-avatar-preview" id="setupAvatarPreview" title="click to upload PFP">?</div>
          <input type="text" class="setup-input" id="usernameInput" placeholder="Pick a unique username" maxlength="24" autocomplete="off">
          <button class="setup-btn" id="setIdentityBtn">Set identity</button>
          <button class="setup-btn secondary" id="clearPfpBtn" title="Remove PFP" style="padding:10px 12px;">✕</button>
        </div>
        <div class="setup-error" id="setupError"></div>
        <input type="file" id="pfpFileInput" accept="image/*">
      </div>

      <!-- messages -->
      <div class="messages" id="messagesContainer">
        <div class="system-msg">Loading messages...</div>
      </div>

      <!-- composer -->
      <div class="composer">
        <input type="text" class="composer-input" id="messageInput" placeholder="Type a message..." maxlength="500" disabled>
        <button class="send-btn" id="sendMsgBtn" disabled title="Send">➤</button>
      </div>
    </main>
  </div>

  <!-- ============================================================
       SUPABASE SDK
       ============================================================ -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.js"></script>

  <script>
    // ================================================================
    // MESSENGER-STYLE GLOBAL CHAT
    // ================================================================
    //
    //   ⬇️  PASTE YOUR SUPABASE KEYS HERE  ⬇️
    //
    const SUPABASE_URL = 'https://nkwpvclvhmrwbofuwsqs.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_YEfvLJKOctQ50DVe8MZbbQ_Oc3_lcrA';

    // ================================================================
    (function() {
      'use strict';

      // ---------- DOM ----------
      const $ = id => document.getElementById(id);

      const el = {
        searchInput:      $('searchInput'),
        contactList:      $('contactList'),
        onlineCount:      $('onlineCount'),
        mySidebarAvatar:  $('mySidebarAvatar'),

        topAvatar:        $('topAvatar'),
        topTitle:         $('topTitle'),
        topStatusText:    $('topStatusText'),

        setupPanel:       $('setupPanel'),
        setupAvatarPreview: $('setupAvatarPreview'),
        usernameInput:    $('usernameInput'),
        setIdentityBtn:   $('setIdentityBtn'),
        clearPfpBtn:      $('clearPfpBtn'),
        pfpFileInput:     $('pfpFileInput'),
        setupError:       $('setupError'),

        messagesContainer: $('messagesContainer'),
        messageInput:     $('messageInput'),
        sendMsgBtn:       $('sendMsgBtn')
      };

      // ---------- STATE ----------
      const CLIENT_ID_KEY = 'messenger_client_id_v1';
      let clientId;
      try {
        clientId = localStorage.getItem(CLIENT_ID_KEY);
        if (!clientId) {
          clientId = (crypto.randomUUID ? crypto.randomUUID() : 'c_' + Math.random().toString(36).slice(2) + Date.now());
          localStorage.setItem(CLIENT_ID_KEY, clientId);
        }
      } catch (e) {
        clientId = 'c_' + Math.random().toString(36).slice(2) + Date.now();
      }

      const me = {
        username: null,
        pfp: null,
        clientId: clientId
      };

      let supa = null;
      let channel = null;
      let identitySet = false;
      let heartbeatTimer = null;

      let cachedMessages = [];
      let cachedUsers = {};

      // ---------- helpers ----------
      function escapeHtml(t) {
        if (t == null) return '';
        const d = document.createElement('div');
        d.textContent = String(t);
        return d.innerHTML;
      }

      function initials(name) {
        if (!name) return '?';
        return name.charAt(0).toUpperCase();
      }

      function status(text, connected) {
        if (el.topStatusText) el.topStatusText.textContent = text;
        const dot = document.querySelector('#topStatus .status-dot');
        if (dot) dot.style.background = connected ? '#31a24c' : '#f0284a';
      }

      function setSetupError(msg) {
        if (el.setupError) el.setupError.textContent = msg || '';
      }

      // ============================================================
      //  BUTTON WIRING (done first, always works)
      // ============================================================

      // --- Upload PFP (sidebar avatar) ---
      if (el.mySidebarAvatar) {
        el.mySidebarAvatar.addEventListener('click', () => {
          if (!identitySet) el.pfpFileInput && el.pfpFileInput.click();
        });
      }

      // --- Upload PFP (setup preview) ---
      if (el.setupAvatarPreview) {
        el.setupAvatarPreview.addEventListener('click', () => {
          if (!el.setupAvatarPreview.classList.contains('locked')) {
            el.pfpFileInput && el.pfpFileInput.click();
          }
        });
      }

      // --- File input ---
      if (el.pfpFileInput) {
        el.pfpFileInput.addEventListener('change', (ev) => {
          const file = ev.target.files && ev.target.files[0];
          if (!file) return;
          if (file.size > 200000) {
            alert('Image too large (max 200KB).');
            el.pfpFileInput.value = '';
            return;
          }
          const r = new FileReader();
          r.onload = (e) => {
            try {
              const url = e.target.result;
              if (url.length > 300000) {
                alert('Image too large after encoding.');
                return;
              }
              me.pfp = url;
              renderMyAvatars();
              if (identitySet) registerOnlineUser().catch(console.error);
            } catch (err) { console.error(err); }
          };
          r.readAsDataURL(file);
          el.pfpFileInput.value = '';
        });
      }

      // --- Remove PFP ---
      if (el.clearPfpBtn) {
        el.clearPfpBtn.addEventListener('click', () => {
          me.pfp = null;
          renderMyAvatars();
          if (identitySet) registerOnlineUser().catch(console.error);
        });
      }

      // --- Set identity ---
      if (el.setIdentityBtn) {
        el.setIdentityBtn.addEventListener('click', (ev) => {
          ev.preventDefault();
          setIdentity().catch(err => {
            console.error(err);
            setSetupError('⚠ ' + (err.message || err));
          });
        });
      }

      // --- Send message ---
      function onSend() {
        sendMessage().catch(err => {
          console.error(err);
          alert('Failed to send: ' + (err.message || err));
        });
      }
      if (el.sendMsgBtn) el.sendMsgBtn.addEventListener('click', onSend);
      if (el.messageInput) {
        el.messageInput.addEventListener('keypress', (ev) => {
          if (ev.key === 'Enter') {
            ev.preventDefault();
            onSend();
          }
        });
      }

      // --- Search filter ---
      if (el.searchInput) {
        el.searchInput.addEventListener('input', () => renderContacts());
      }

      // ============================================================
      //  AVATAR RENDERING
      // ============================================================
      function renderMyAvatars() {
        const html = me.pfp
          ? '<img src="' + me.pfp + '" alt="">'
          : initials(me.username || '?');

        if (el.mySidebarAvatar) el.mySidebarAvatar.innerHTML = html;
        if (el.setupAvatarPreview) el.setupAvatarPreview.innerHTML = html;

        if (el.topAvatar) {
          el.topAvatar.innerHTML = me.pfp
            ? '<img src="' + me.pfp + '" alt="">'
            : initials(me.username || '#');
        }
      }

      // ============================================================
      //  SET IDENTITY
      // ============================================================
      async function setIdentity() {
        const desired = (el.usernameInput.value || '').trim();
        setSetupError('');

        if (!desired) { setSetupError('⚠ username cannot be empty'); return; }
        if (desired.length < 2) { setSetupError('⚠ at least 2 characters'); return; }
        if (!/^[a-zA-Z0-9_\-\.]+$/.test(desired)) { setSetupError('⚠ only letters, numbers, _ - .'); return; }
        if (!supa) { setSetupError('⚠ not connected to server'); return; }

        el.setIdentityBtn.disabled = true;
        el.setIdentityBtn.textContent = 'Checking...';

        try {
          const taken = await isUsernameTaken(desired, me.clientId);
          if (taken) {
            setSetupError('⚠ username already taken');
            el.setIdentityBtn.disabled = false;
            el.setIdentityBtn.textContent = 'Set identity';
            return;
          }

          me.username = desired;
          identitySet = true;

          // Register
          await registerOnlineUser();

          // Enable composer
          el.messageInput.disabled = false;
          el.sendMsgBtn.disabled = false;

          // Join system message
          await sendMessageToSupabase('system', null, me.username + ' joined the chat');

          // Lock setup
          el.usernameInput.disabled = true;
          el.setIdentityBtn.disabled = true;
          el.setIdentityBtn.textContent = '✓ Set';
          el.clearPfpBtn.disabled = true;
          el.setupAvatarPreview.classList.add('locked');
          renderMyAvatars();

          // Update top bar title
          el.topTitle.textContent = 'Nexus Global Chat';

        } catch (err) {
          console.error(err);
          setSetupError('⚠ ' + (err.message || err));
          el.setIdentityBtn.disabled = false;
          el.setIdentityBtn.textContent = 'Set identity';
        }
      }

      // ============================================================
      //  SEND
      // ============================================================
      async function sendMessage() {
        const text = (el.messageInput.value || '').trim();
        if (!text) return;
        if (!me.username) { alert('Set a username first'); return; }
        if (!supa) { alert('Not connected'); return; }

        await sendMessageToSupabase(me.username, me.pfp, text);
        el.messageInput.value = '';
        el.messageInput.focus();
        if (identitySet) registerOnlineUser().catch(console.error);
      }

      // ============================================================
      //  SUPABASE OPERATIONS
      // ============================================================
      async function registerOnlineUser() {
        if (!supa || !me.username) return;
        const row = {
          client_id: me.clientId,
          username: me.username,
          pfp_data_url: me.pfp || null,
          last_seen: new Date().toISOString()
        };
        const { error } = await supa.from('online_users').upsert(row, { onConflict: 'client_id' });
        if (error) throw error;
      }

      async function unregisterOnlineUser() {
        if (!supa) return;
        try { await supa.from('online_users').delete().eq('client_id', me.clientId); } catch (e) {}
      }

      async function isUsernameTaken(username, excludeClientId) {
        if (!supa) return false;
        const { data, error } = await supa
          .from('online_users')
          .select('client_id, username')
          .ilike('username', username);
        if (error) throw error;
        return (data || []).some(u =>
          u.client_id !== excludeClientId &&
          String(u.username).toLowerCase() === username.toLowerCase()
        );
      }

      async function sendMessageToSupabase(username, pfp, text) {
        if (!supa) throw new Error('not connected');
        const { error } = await supa.from('messages').insert({
          username: username,
          pfp_data_url: pfp || null,
          text: text
        });
        if (error) throw error;
      }

      async function loadInitialMessages() {
        if (!supa) return;
        const { data, error } = await supa
          .from('messages')
          .select('*')
          .order('created_at', { ascending: true })
          .limit(200);
        if (error) throw error;
        cachedMessages = data || [];
        renderMessages();
      }

      async function refreshOnlineUsers() {
        if (!supa) return;
        try {
          const cutoff = new Date(Date.now() - 45000).toISOString();
          await supa.from('online_users').delete().lt('last_seen', cutoff);
        } catch (e) {}

        try {
          const { data, error } = await supa.from('online_users').select('*');
          if (error) throw error;
          cachedUsers = {};
          (data || []).forEach(u => { cachedUsers[u.client_id] = u; });
          updateOnlineCount();
          renderContacts();
          renderMessages();
        } catch (e) { console.error(e); }
      }

      function subscribeRealtime() {
        if (!supa) return;
        if (channel) { try { supa.removeChannel(channel); } catch (e) {} }

        channel = supa
          .channel('messenger-global-chat')
          .on('postgres_changes',
              { event: '*', schema: 'public', table: 'messages' },
              (payload) => {
                try {
                  if (payload.eventType === 'INSERT') {
                    if (!cachedMessages.some(m => m.id === payload.new.id)) {
                      cachedMessages.push(payload.new);
                      if (cachedMessages.length > 200) cachedMessages = cachedMessages.slice(-200);
                      renderMessages();
                    }
                  } else if (payload.eventType === 'DELETE') {
                    cachedMessages = cachedMessages.filter(m => m.id !== payload.old.id);
                    renderMessages();
                  }
                } catch (e) { console.error(e); }
              })
          .on('postgres_changes',
              { event: '*', schema: 'public', table: 'online_users' },
              () => { refreshOnlineUsers().catch(console.error); })
          .subscribe((s) => {
            if (s === 'SUBSCRIBED') status('online', true);
            else if (s === 'CHANNEL_ERROR' || s === 'TIMED_OUT') status('reconnecting...', false);
          });
      }

      // ============================================================
      //  RENDERING
      // ============================================================
      function renderContacts() {
        if (!el.contactList) return;
        const filter = (el.searchInput.value || '').toLowerCase().trim();
        const users = Object.values(cachedUsers).filter(u => u && u.username);

        const filtered = filter
          ? users.filter(u => u.username.toLowerCase().includes(filter))
          : users;

        if (filtered.length === 0) {
          el.contactList.innerHTML = '<div style="padding:20px;text-align:center;color:#8a8d91;font-size:13px;">' +
            (filter ? 'No matches' : 'No one online yet') + '</div>';
          return;
        }

        el.contactList.innerHTML = filtered.map(u => {
          const av = u.pfp_data_url
            ? '<img src="' + u.pfp_data_url + '" alt="">'
            : initials(u.username);
          const preview = u.client_id === me.clientId ? 'You' : 'Tap to say hi';
          return '<div class="contact">' +
            '<div class="contact-avatar-wrap">' +
              '<div class="contact-avatar">' + av + '</div>' +
              '<div class="online-dot"></div>' +
            '</div>' +
            '<div class="contact-info">' +
              '<div class="contact-name">' + escapeHtml(u.username) + '</div>' +
              '<div class="contact-preview">' + preview + '</div>' +
            '</div>' +
          '</div>';
        }).join('');
      }

      function renderMessages() {
        if (!el.messagesContainer) return;
        const msgs = cachedMessages || [];

        if (msgs.length === 0) {
          el.messagesContainer.innerHTML = '<div class="system-msg">No messages yet — say hi 👋</div>';
          return;
        }

        let html = '';
        msgs.forEach(m => {
          const own = me.username && m.username === me.username;
          let pfp = m.pfp_data_url;
          if (!pfp) {
            const u = Object.values(cachedUsers).find(x => x && x.username === m.username);
            if (u && u.pfp_data_url) pfp = u.pfp_data_url;
          }
          const av = pfp
            ? '<img src="' + pfp + '" alt="" onerror="this.style.display=\'none\'">'
            : initials(m.username);

          const t = m.created_at
            ? new Date(m.created_at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
            : '';

          if (m.username === 'system') {
            html += '<div class="system-msg">' + escapeHtml(m.text) + '</div>';
            return;
          }

          html += '<div class="msg-row' + (own ? ' own' : '') + '">' +
            '<div class="msg-avatar">' + av + '</div>' +
            '<div class="msg-bubble-wrap">' +
              (!own ? '<div class="msg-sender-name">' + escapeHtml(m.username) + '</div>' : '') +
              '<div class="msg-bubble">' + escapeHtml(m.text) + '</div>' +
              '<div class="msg-time">' + t + '</div>' +
            '</div>' +
          '</div>';
        });

        el.messagesContainer.innerHTML = html;
        el.messagesContainer.scrollTop = el.messagesContainer.scrollHeight;
      }

      function updateOnlineCount() {
        const n = Object.keys(cachedUsers || {}).length;
        if (el.onlineCount) el.onlineCount.textContent = n;
      }

      // ============================================================
      //  HEARTBEAT + CLEANUP
      // ============================================================
      function startHeartbeat() {
        if (heartbeatTimer) clearInterval(heartbeatTimer);
        heartbeatTimer = setInterval(() => {
          if (identitySet && me.username && supa) {
            registerOnlineUser().catch(console.error);
            refreshOnlineUsers().catch(console.error);
          }
        }, 20000);
      }

      window.addEventListener('beforeunload', () => unregisterOnlineUser());
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && identitySet && me.username) {
          registerOnlineUser().catch(console.error);
          refreshOnlineUsers().catch(console.error);
        }
      });

      // ============================================================
      //  INIT
      // ============================================================
      (async function init() {
        renderMyAvatars();

        // placeholders?
        if (SUPABASE_URL === 'PASTE_YOUR_PROJECT_URL_HERE' || SUPABASE_KEY === 'PASTE_YOUR_ANON_KEY_HERE') {
          status('⚠ paste supabase keys', false);
          el.messagesContainer.innerHTML = '<div class="system-msg" style="color:#f0284a">⚠ Open the HTML file and paste your Supabase URL + anon key.</div>';
          return;
        }

        if (typeof window.supabase === 'undefined' || !window.supabase.createClient) {
          status('⚠ sdk failed to load', false);
          el.messagesContainer.innerHTML = '<div class="system-msg" style="color:#f0284a">⚠ Supabase SDK did not load. Check your connection.</div>';
          return;
        }

        try {
          supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
            realtime: { params: { eventsPerSecond: 10 } }
          });
          status('connecting...', false);
        } catch (e) {
          console.error(e);
          status('init failed', false);
          return;
        }

        try { await loadInitialMessages(); } catch (e) { console.error(e); }
        try { await refreshOnlineUsers(); } catch (e) { console.error(e); }
        try { subscribeRealtime(); } catch (e) { console.error(e); }

        status('online', true);
        startHeartbeat();
      })();

    })();
  </script>
</body>
</html>
